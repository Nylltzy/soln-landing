name: Sync assets and lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch favicon PNGs from the live site
        run: |
          curl -fsSL https://sol-n-b0yt4j.freebuff.site/favicon.png -o public/favicon.png
          curl -fsSL https://sol-n-b0yt4j.freebuff.site/apple-touch-icon.png -o public/apple-touch-icon.png
          sha256sum public/favicon.png public/apple-touch-icon.png

      - uses: oven-sh/setup-bun@v2

      - name: Generate lockfile
        run: bun install --lockfile-only

      - name: Commit and push
        run: |
          git config user.name "Nylltzy"
          git config user.email "152249429+Nylltzy@users.noreply.github.com"
          git add public/favicon.png public/apple-touch-icon.png bun.lock
          git commit -m "Add favicon PNGs, touch icon and bun.lock"
          git push
